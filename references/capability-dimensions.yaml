# ──────────────────────────────────────────────
# v9.0.0 新增：ZCode 11 种 sub-agent 的能力映射
# 来源：profile.md 的 description + tools 列表 + 实际观察
# ──────────────────────────────────────────────
agent_tools:
  - name: general-purpose
    type: agent
    capabilities:
      reasoning: {level: 7, source: "通用推理"}
      file-ops: {level: 8, source: "全工具权限"}
      code-analysis: {level: 6, source: "通用代码处理"}
      research: {level: 7, source: "通用调研"}

  - name: Explore
