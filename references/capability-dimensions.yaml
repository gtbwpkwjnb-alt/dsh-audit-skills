      file-ops: {level: 6, source: "Read/Glob/Grep"}

  - name: quality-expert
    type: agent
    capabilities:
      skill-audit: {level: 8, source: "完成定义/测试策略/质量门禁"}
      code-analysis: {level: 7, source: "回归范围分析"}
      reasoning: {level: 8, source: "冻结验证建议"}

  - name: security-expert
    type: agent
    capabilities:
      skill-audit: {level: 7, source: "权限/注入/秘密检测"}
      reasoning: {level: 8, source: "数据流/副作用边界分析"}

  - name: solution-architect
    type: agent
    capabilities:
      reasoning: {level: 9, source: "总体方案/模块边界"}
      code-analysis: {level: 7, source: "替代方案/推荐节点 DAG"}
      research: {level: 7, source: "实施约束分析"}

  - name: research-worker
    type: agent
    capabilities:
      research: {level: 9, source: "批量机械化信息采集"}
      web-search: {level: 8, source: "WebFetch/WebSearch"}
      file-ops: {level: 6, source: "Read/Glob/Grep"}

  - name: glm-adversarial-reviewer
    type: agent
    capabilities:
      reasoning: {level: 8, source: "对抗审查/反证"}
      skill-audit: {level: 7, source: "找不可实现项/越权假设"}
      code-analysis: {level: 6, source: "不可测验收检测"}

# ──────────────────────────────────────────────
# 能力维度冲突/互补判定阈值（v9.0.0）
# 用于 agent-dispatch-ambiguity.md 的 overlap 计算
# ──────────────────────────────────────────────
# [local-patch 2026-08-08] 补充 ZCode 会话历史中出现的 5 个 agent（COLLABORATION.md §8 角色体系）
  - name: manager
    type: agent
    capabilities:
      planning: {level: 8, source: "出《实施方案》/任务拆解"}
      reasoning: {level: 7, source: "对抗审查/终审确认"}
      code-analysis: {level: 5, source: "方案评审"}
  - name: tech-lead
    type: agent
    capabilities:
      code-analysis: {level: 8, source: "spec+质量双审/技能合规"}
      reasoning: {level: 7, source: "《审查报告》"}
      file-ops: {level: 5, source: "读代码与规则"}
  - name: researcher
    type: agent
    capabilities:
      research: {level: 8, source: "多源检索/只读侦察"}
      web-search: {level: 7, source: "agent-reach 13 渠道"}
      file-ops: {level: 5, source: "读文件取证"}
  - name: doc-writer
    type: agent
    capabilities:
      file-ops: {level: 8, source: "文档撰写/格式化"}
      code-analysis: {level: 6, source: "测试落码/样板代码"}
      reasoning: {level: 5, source: "文档结构组织"}
  - name: debugger
    type: agent
    capabilities:
      code-analysis: {level: 8, source: "根因定位/影响分析"}
      file-ops: {level: 6, source: "读代码定位"}
      reasoning: {level: 6, source: "修复建议"}

overlap_thresholds:
  capability_jaccard:
    high_conflict: 0.7    # >= 0.7 触发合并建议
    medium_conflict: 0.5  # >= 0.5 触发边界澄清
    complementary: 0.3    # < 0.3 且有共同画像词 → 互补
  weighted_overlap:
    high_conflict: 0.6
    medium_conflict: 0.4
  dispatch_frequency_diff:
    critical: 0.3         # 调用频次差异 >= 30% 触发风险
    warning: 0.2
